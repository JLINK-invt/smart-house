asyncapi: 3.0.0
info:
  title: Smart House MQTT telemetry
  version: 1.0.0
  description: Simulated gateway profile telemetry and command acknowledgements.
servers:
  local:
    host: localhost:8883
    protocol: mqtts
    description: Local development requires a client certificate issued by infra/local/certs/ca.crt.
channels:
  telemetry:
    address: tenants/{tenantId}/devices/{deviceId}/telemetry
    parameters:
      tenantId:
        description: Tenant identifier.
      deviceId:
        description: Device identifier.
    messages:
      temperature:
        payload:
          $ref: '#/components/schemas/TemperatureTelemetry'
        examples:
          - name: temperature-v1
            payload:
              schemaVersion: '1.0'
              messageId: msg-temp-001-example-000001
              deviceId: temp-001
              tenantId: demo
              occurredAt: '2026-08-06T12:00:00.000Z'
              deviceType: temperature_sensor
              metrics:
                temperature: { value: 24.1, unit: celsius }
          - name: temperature-fahrenheit-v1
            payload:
              schemaVersion: '1.0'
              messageId: msg-temp-001-fahrenheit-000001
              deviceId: temp-001
              tenantId: demo
              occurredAt: '2026-08-06T12:00:00.000Z'
              deviceType: temperature_sensor
              metrics:
                temperature: { value: 75.2, unit: fahrenheit }
      relay:
        payload:
          $ref: '#/components/schemas/RelayTelemetry'
        examples:
          - name: relay-v1
            payload:
              schemaVersion: '1.0'
              messageId: msg-relay-001-example-000001
              deviceId: relay-001
              tenantId: demo
              occurredAt: '2026-08-06T12:00:00-06:00'
              deviceType: relay
              metrics:
                relayState: { value: true, unit: boolean }
operations:
  publishTelemetry:
    action: receive
    channel:
      $ref: '#/channels/telemetry'
components:
  schemas:
    TelemetryBase:
      type: object
      required: [schemaVersion, messageId, deviceId, tenantId, occurredAt]
      properties:
        schemaVersion: { type: string, const: '1.0' }
        messageId: { type: string, minLength: 1, maxLength: 128 }
        deviceId: { type: string, minLength: 1, maxLength: 128 }
        tenantId: { type: string, minLength: 1, maxLength: 64 }
        occurredAt: { type: string, format: date-time }
    TemperatureTelemetry:
      allOf:
        - $ref: '#/components/schemas/TelemetryBase'
        - type: object
          required: [deviceType, metrics]
          properties:
            deviceType: { const: temperature_sensor }
            metrics:
              type: object
              additionalProperties: false
              required: [temperature]
              properties:
                temperature:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [value, unit]
                      properties:
                        value: { type: number, minimum: -50, maximum: 100 }
                        unit: { const: celsius }
                    - type: object
                      additionalProperties: false
                      required: [value, unit]
                      properties:
                        value: { type: number, minimum: -58, maximum: 212 }
                        unit: { const: fahrenheit }
    RelayTelemetry:
      allOf:
        - $ref: '#/components/schemas/TelemetryBase'
        - type: object
          required: [deviceType, metrics]
          properties:
            deviceType: { const: relay }
            metrics:
              type: object
              additionalProperties: false
              required: [relayState]
              properties:
                relayState:
                  type: object
                  additionalProperties: false
                  required: [value, unit]
                  properties:
                    value: { type: boolean }
                    unit: { const: boolean }
