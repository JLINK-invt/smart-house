services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_DB: smart_house
      POSTGRES_USER: smart_house
      POSTGRES_PASSWORD: smart_house
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../packages/database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_house -d smart_house"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4318:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  postgres-data:
  redis-data:
  mqtt-data:
