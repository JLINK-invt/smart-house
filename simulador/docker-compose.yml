services:
  mqtt:
    image: eclipse-mosquitto:2.0.20@sha256:21421af7b32bf9ce508e9090c8eb13bb81f410ca778dc205506180a6f862d0eb
    user: "0:0"
    ports:
      - "127.0.0.1:${MQTT_PORT:-8883}:8883"
    volumes:
      - ../infra/local/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../infra/local/mosquitto.acl:/mosquitto/config/aclfile:ro
      - ../infra/local/certs:/mosquitto/certs:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
            "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/platform-worker.crt --key /mosquitto/certs/platform-worker.key -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mqtt-data:
