name: Supply Chain

on:
  pull_request:
  push:
    branches: [main, feat/operational-observability]

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:supply-chain
      - name: Generate CycloneDX SBOM
        run: >-
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/out"
          anchore/syft:v1.20.0@sha256:b46e597614ddc78621e560af3fabf9346e35462ea1c886a38b30bcc7ca601a73 dir:/src -o cyclonedx-json=/out/sbom.cdx.json
      - name: Scan filesystem for vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.61.0@sha256:6967db29ce5294d054121e94b3cb1262de858af63b4547bb1bade66a4306f2e4
          fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed /src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
